name: Site and docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: python -m pip install 'sphinx>=7.2' 'myst-parser>=3' sphinxcontrib-bibtex sphinxcontrib-mermaid

      - name: Build landing page
        run: python site/scripts/build_site.py --config site/site.config.json --output _site/index.html

      - name: Build Sphinx documentation
        run: sphinx-build -W -b html docs _site/docs

      - name: Assemble site and check links
        run: |
          cp -R site/static _site/static
          touch _site/.nojekyll
          python site/scripts/check_site.py _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
